# ====================================================
# LISTA MAESTRA DE RETOS DE BINGO
# ====================================================
# Esta es la lista completa de retos disponibles.
# Cuando se genera una nueva tabla de bingo, se seleccionan
# retos aleatorios de esta lista.
#
# Formato de cada reto:
#   id:
#     type: COLLECT_ITEM | KILL_MOB | MINE_BLOCK
#     material: Material de Minecraft (para COLLECT_ITEM y MINE_BLOCK)
#     mob: Tipo de mob (para KILL_MOB)
#     amount: Cantidad requerida
#     display-name: Nombre que se muestra (con codigos de color &)
#     description: Descripcion del reto
#     icon: Material usado como icono en el GUI
#
# NOTA: Los retos MINE_BLOCK usan bloques que NO dropean items
#       (spawners, buds de amatista, reinforced deepslate, sculk),
#       por lo que solo se pueden completar rompiendolos en el mundo.
# ====================================================

