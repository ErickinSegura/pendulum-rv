# =====================================================================
#  Sistema de canje de códigos de easter egg  (/pdl canjear <codigo>)
# ---------------------------------------------------------------------
#  - Cada codigo se canjea UNA sola vez por jugador.
#  - Los codigos son FIJOS y compartidos: quien los descubre en la web
#    puede canjearlos en el juego. La comparacion ignora mayusculas y
#    espacios sobrantes.
#  - Puedes agregar / editar codigos aqui sin recompilar el plugin.
#
#  Campos por item (dentro de 'items'):
#    material              -> nombre del Material (ej. TOTEM_OF_UNDYING)
#    cantidad              -> cantidad (por defecto 1)
#    nombre                -> nombre visible (soporta codigos & de color)
#    lore                  -> lista de lineas de descripcion
#    inrompible            -> true/false
#    brillo                -> true/false (efecto de encantamiento visual)
#    encantamientos        -> lista "ENCANTAMIENTO:NIVEL"
#    atributos             -> lista de { atributo, cantidad, operacion, slot }
#    pocion                -> tipo de pocion base (solo material POTION)
#    cabeza_dueno          -> nombre del jugador dueno (solo PLAYER_HEAD)
#    cabeza_textura        -> textura base64 personalizada (solo PLAYER_HEAD)
#    bandera_patrones      -> lista "PATRON:COLOR" (solo *_BANNER)
#    disco_aleatorio       -> true: entrega un disco de musica al azar
# =====================================================================

# Escribe una linea de auditoria (jugador, codigo, fecha) en la consola
# y en el archivo canjes-registro.log cada vez que alguien canjea.
registrar-canjes: true

canjes:

  # El Código Ancestral (Konami)
  PND-KONAMI-1UP:
    descripcion: "&fTótem de la Inmortalidad"
    items:
      - material: TOTEM_OF_UNDYING
        cantidad: 1

  # Insistencia (10 clicks al logo)
  PND-LOGO-X10:
    descripcion: "&fUn stack de papas asadas"
    items:
      - material: BAKED_POTATO
        cantidad: 64

  # (CUSTOM) La Palabra: Reloj Dorado del Pendulo, item comestible de un
  # solo uso que otorga 1 hora extra de dia (RelojDorado / RelojDoradoListener).
  PND-TEMPUS-88:
    descripcion: "&6Reloj Dorado del Péndulo &7(1 hora extra de día · un solo uso)"
    items:
      - custom_item: reloj_dorado
        cantidad: 1

  # Tras la Cortina (consola __pendulum())
  PND-DEV-0xC0DE:
    descripcion: "&fCabeza de Jeb &7+ &f1 Netherite Scrap"
    items:
      - material: PLAYER_HEAD
        cantidad: 1
        cabeza_dueno: "jeb_"
      - material: NETHERITE_SCRAP
        cantidad: 1

  # Speedrunner (recorrido en menos de 5s)
  PND-WR-4NAV:
    descripcion: "&f5 pociones de Velocidad I"
    items:
      - material: POTION
        cantidad: 5
        pocion: SWIFTNESS

  # Vigilante (inmovil 60s)
  PND-WATCH-60:
    descripcion: "&f64 antorchas"
    items:
      - material: TORCH
        cantidad: 64

  # Trasnochador (entrar entre 3 y 4 am)
  PND-3AM-OWL:
    descripcion: "&fReloj &7+ &f32 zanahorias doradas"
    items:
      - material: CLOCK
        cantidad: 1
      - material: GOLDEN_CARROT
        cantidad: 32

  # Madrugador (entrar entre 5 y 6 am)
  PND-5AM-LARK:
    descripcion: "&fReloj &7+ &f32 zanahorias doradas"
    items:
      - material: CLOCK
        cantidad: 1
      - material: GOLDEN_CARROT
        cantidad: 32

  # (CUSTOM) Fundador (entrar el dia del lanzamiento)
  PND-DAY1-FOUNDER:
    descripcion: "&6Estandarte Conmemorativo &7+ &fTótem de la Inmortalidad"
    items:
      - material: WHITE_BANNER
        cantidad: 1
        nombre: "&6&lEstandarte del Fundador"
        lore:
          - "&7Estuviste aquí desde el día uno."
          - "&8Easter Egg · Day 1"
        bandera_patrones:
          - "gradient:YELLOW"
          - "circle:ORANGE"
          - "border:BLACK"
      - material: TOTEM_OF_UNDYING
        cantidad: 1

  # (CUSTOM) El Pendulo (oscilar con el teclado)
  PND-SWING-LR:
    descripcion: "&6Reloj Dorado del Péndulo &7(1 hora extra de día · un solo uso)"
    items:
      - custom_item: reloj_dorado
        cantidad: 1

  # Cartografo (zoom maximo en el mapa)
  PND-MAP-MAXZOOM:
    descripcion: "&f3 stacks de papel"
    items:
      - material: PAPER
        cantidad: 64
      - material: PAPER
        cantidad: 64
      - material: PAPER
        cantidad: 64

  # Melodia (teclear a s d f): jukebox + 3 discos aleatorios.
  PND-TUNE-ASDF:
    descripcion: "&fJukebox &7+ &f3 discos de música aleatorios"
    items:
      - material: JUKEBOX
        cantidad: 1
      - disco_aleatorio: true
        cantidad: 1
      - disco_aleatorio: true
        cantidad: 1
      - disco_aleatorio: true
        cantidad: 1

  # Bajo el Capo (leer el codigo fuente)
  PND-SRC-1337:
    descripcion: "&fBloque de comandos"
    items:
      - material: COMMAND_BLOCK
        cantidad: 1
