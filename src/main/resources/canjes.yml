# =====================================================================
#  Sistema de canje de códigos de easter egg  (/pdl canjear <codigo>)
# ---------------------------------------------------------------------
#  - Cada codigo se canjea UNA sola vez por jugador.
#  - Los codigos son FIJOS y compartidos: quien los descubre en la web
#    puede canjearlos en el juego. La comparacion ignora mayusculas y
#    espacios sobrantes.
#  - Puedes agregar / editar codigos aqui sin recompilar el plugin.
#
#  Campos por item (dentro de 'items'):
#    material              -> nombre del Material (ej. TOTEM_OF_UNDYING)
#    cantidad              -> cantidad (por defecto 1)
#    nombre                -> nombre visible (soporta codigos & de color)
#    lore                  -> lista de lineas de descripcion
#    inrompible            -> true/false
#    brillo                -> true/false (efecto de encantamiento visual)
#    encantamientos        -> lista "ENCANTAMIENTO:NIVEL"
#    atributos             -> lista de { atributo, cantidad, operacion, slot }
#    pocion                -> tipo de pocion base (solo material POTION)
#    cabeza_dueno          -> nombre del jugador dueno (solo PLAYER_HEAD)
#    cabeza_textura        -> textura base64 personalizada (solo PLAYER_HEAD)
#    bandera_patrones      -> lista "PATRON:COLOR" (solo *_BANNER)
#    disco_aleatorio       -> true: entrega un disco de musica al azar
# =====================================================================

# Escribe una linea de auditoria (jugador, codigo, fecha) en la consola
# y en el archivo canjes-registro.log cada vez que alguien canjea.
registrar-canjes: true

canjes:

  PND-KONAMI-1UP:
    descripcion: "&fUna vida extra &7(Tótem de la Inmortalidad)"
    items:
      - material: TOTEM_OF_UNDYING
        cantidad: 1

  PND-LOGO-X10:
    descripcion: "&fÉlitros &7+ &f4 cohetes"
    items:
      - material: ELYTRA
        cantidad: 1
      - material: FIREWORK_ROCKET
        cantidad: 4

  # (CUSTOM) Reloj dorado del Pendulo: reloj nombrado con brillo.
  PND-TEMPUS-88:
    descripcion: "&6Reloj Dorado del Péndulo"
    items:
      - material: CLOCK
        cantidad: 1
        nombre: "&6&lReloj Dorado del Péndulo"
        brillo: true
        lore:
          - "&7El tiempo siempre vuelve al centro."
          - "&8Easter Egg · Tempus"

  # (CUSTOM) Cabeza de dev: por defecto usa el skin del owner del server.
  #          Cambia 'cabeza_dueno' por el nick que quieras.
  PND-DEV-0xC0DE:
    descripcion: "&5Cabeza de Dev &7+ &fBloque de Netherita"
    items:
      - material: PLAYER_HEAD
        cantidad: 1
        nombre: "&5&lCabeza de Dev"
        cabeza_dueno: "ErickinSegura"
        lore:
          - "&7Compilado con amor y bugs."
          - "&8Easter Egg · 0xC0DE"
      - material: NETHERITE_BLOCK
        cantidad: 1

  # (CUSTOM) Botas de rapidez II: dan Velocidad II al equiparse mediante
  #          un modificador de atributo en el slot FEET (+40% = Speed II).
  PND-WR-4NAV:
    descripcion: "&bBotas de Rapidez II &7+ &f16 de azúcar"
    items:
      - material: DIAMOND_BOOTS
        cantidad: 1
        nombre: "&b&lBotas de Rapidez II"
        inrompible: true
        lore:
          - "&7Otorgan &fVelocidad II &7al equiparse."
          - "&8Easter Egg · World Record"
        atributos:
          - atributo: MOVEMENT_SPEED
            cantidad: 0.40
            operacion: ADD_SCALAR
            slot: FEET
      - material: SUGAR
        cantidad: 16

  # (CUSTOM) Farol eterno + pocion de vision nocturna extendida.
  PND-WATCH-60:
    descripcion: "&eFarol Eterno &7+ &9Visión Nocturna Extendida"
    items:
      - material: LANTERN
        cantidad: 1
        nombre: "&e&lFarol Eterno"
        brillo: true
        lore:
          - "&7Nunca se apaga."
          - "&8Easter Egg · Watch"
      - material: POTION
        cantidad: 1
        nombre: "&9Poción de Visión Nocturna Extendida"
        pocion: LONG_NIGHT_VISION

  # (CUSTOM) Cabeza de buho + taza de cafe.
  #          Pega una textura base64 de cabeza de buho en 'cabeza_textura'
  #          si quieres el modelo real; por defecto es una cabeza nombrada.
  PND-3AM-OWL:
    descripcion: "&6Cabeza de Búho &7+ &fTaza de Café"
    items:
      - material: PLAYER_HEAD
        cantidad: 1
        nombre: "&6&lCabeza de Búho"
        cabeza_textura: ""
        lore:
          - "&7Para los que nunca duermen."
          - "&8Easter Egg · 3AM"
      - material: HONEY_BOTTLE
        cantidad: 1
        nombre: "&6&lTaza de Café"
        lore:
          - "&7Un empujón para seguir despierto."

  PND-5AM-LARK:
    descripcion: "&fReloj &7+ &f8 zanahorias doradas"
    items:
      - material: CLOCK
        cantidad: 1
      - material: GOLDEN_CARROT
        cantidad: 8

  # (CUSTOM) Estandarte conmemorativo + totem.
  PND-DAY1-FOUNDER:
    descripcion: "&6Estandarte Conmemorativo &7+ &fTótem"
    items:
      - material: WHITE_BANNER
        cantidad: 1
        nombre: "&6&lEstandarte del Fundador"
        lore:
          - "&7Estuviste aquí desde el día uno."
          - "&8Easter Egg · Day 1"
        bandera_patrones:
          - "gradient:YELLOW"
          - "circle:ORANGE"
          - "border:BLACK"
      - material: TOTEM_OF_UNDYING
        cantidad: 1

  PND-SWING-LR:
    descripcion: "&fBrújula encantada &7+ &f8 de lapislázuli"
    items:
      - material: COMPASS
        cantidad: 1
        nombre: "&bBrújula del Péndulo"
        brillo: true
      - material: LAPIS_LAZULI
        cantidad: 8

  # El mapa se entrega como filled_map nombrado (decorativo, no es un
  # mapa de exploracion funcional).
  PND-MAP-MAXZOOM:
    descripcion: "&fMapa del Tesoro &7+ &fCatalejo"
    items:
      - material: FILLED_MAP
        cantidad: 1
        nombre: "&2&lMapa del Tesoro"
        lore:
          - "&7X marca el lugar."
      - material: SPYGLASS
        cantidad: 1

  # (CUSTOM) Caja musical + disco de musica aleatorio.
  PND-TUNE-ASDF:
    descripcion: "&dCaja Musical &7+ &fDisco de música aleatorio"
    items:
      - material: JUKEBOX
        cantidad: 1
        nombre: "&d&lCaja Musical"
        lore:
          - "&7Deja sonar la melodía."
          - "&8Easter Egg · Tune"
      - material: MUSIC_DISC_CAT
        cantidad: 1
        disco_aleatorio: true

  # Command block decorativo (los jugadores sin op no pueden colocarlo).
  PND-SRC-1337:
    descripcion: "&fBloque de comandos &7+ &f8 esmeraldas"
    items:
      - material: COMMAND_BLOCK
        cantidad: 1
        nombre: "&c&lReliquia del Código Fuente"
        lore:
          - "&7Lo encontraste en el HTML."
      - material: EMERALD
        cantidad: 8
